name: Release

# THE product is the office-PC web app again (client decision, ADR-027): a central PC
# runs the server, operators use it from browsers. Every push to green main publishes
# the PC release zip that the office supervisor auto-updates from (the 1.0.x line, in
# THIS private repo — the supervisor polls with its PAT).
#
# The Android build (android-release.yml, 1.1.x, public bharti-releases repo) is
# dormant: manual-only, so it can never race this workflow for releases/latest.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Built on windows-latest so native modules (better-sqlite3, sharp) ship the
    # win32-x64 prebuilds matching the office machine and pinned Node ABI.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Self-contained gate: a release is only published if everything passes HERE.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Compute version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          echo "VERSION=$version" >> $env:GITHUB_ENV
      - name: Package release zip
        shell: pwsh
        run: node scripts/package-release.mjs $env:VERSION
      # Published to a small PUBLIC repository (ADR-042) so the office PC can check for
      # and download updates with no credentials at all — nothing to create when
      # installing and nothing that expires silently months later. The source stays
      # private. Requires that repo to exist (with a README, so it has a default branch)
      # and a fine-grained PAT with Contents: read+write on it, as RELEASES_REPO_TOKEN.
      # Until that secret is set, releases land here instead and the office will not
      # see them — the run stays green but says so loudly.
      - name: Create GitHub Release
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || 'iodex99/bharti-releases' }}
          # via env, never interpolated into the script: a commit message is arbitrary text
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASES_TOKEN" ]; then
            export GH_TOKEN="$RELEASES_TOKEN"
            TARGET="$RELEASES_REPO"
          else
            export GH_TOKEN="$FALLBACK_TOKEN"
            TARGET="$GITHUB_REPOSITORY"
            echo "::warning title=Update feed not configured::RELEASES_REPO_TOKEN is not set, so v$VERSION went to the private repo $TARGET. Office installs poll $RELEASES_REPO and will NOT see this release. See docs/DEPLOYMENT.md."
          fi
          echo "Publishing v$VERSION to $TARGET"

          # Re-running a workflow reuses its run number; the rebuilt assets are
          # equivalent, so replace the release rather than failing the run.
          if gh release view "v$VERSION" --repo "$TARGET" >/dev/null 2>&1; then
            echo "v$VERSION already exists — replacing it."
            gh release delete "v$VERSION" --repo "$TARGET" --yes --cleanup-tag
          fi
          # install.ps1 is what the office's one-line install fetches, via the stable
          # .../releases/latest/download/install.ps1 URL (ADR-045).
          gh release create "v$VERSION" \
            "dist-release/bharti-app-v$VERSION.zip" \
            "dist-release/install.ps1" \
            "dist-release/install.cmd" \
            "dist-release/checksums.txt" \
            --repo "$TARGET" \
            --title "v$VERSION" \
            --notes "${NOTES:-Release v$VERSION}"
