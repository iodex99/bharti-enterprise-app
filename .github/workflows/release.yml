name: Release (PC server — manual)

# The shipped product is the Android app, released by android-release.yml on every push.
# This workflow builds the optional Windows PC deployment and is MANUAL ONLY: if both ran
# on every push they would race for version tags, and — worse — whichever finished last
# would become `releases/latest`, which is the feed installed apps read to decide whether
# an update exists. A PC zip has no app-manifest.json, so it would look like a broken
# release to every device.
#
# It publishes the 1.0.x line; the app publishes 1.1.x.

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Built on windows-latest so native modules (better-sqlite3, sharp) ship the
    # win32-x64 prebuilds matching the office machine and pinned Node ABI.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Self-contained gate: a release is only published if everything passes HERE.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Compute version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          echo "VERSION=$version" >> $env:GITHUB_ENV
      - name: Package release zip
        shell: pwsh
        run: node scripts/package-release.mjs $env:VERSION
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$env:VERSION" `
            "dist-release/bharti-app-v$env:VERSION.zip" `
            "dist-release/checksums.txt" `
            --title "v$env:VERSION" `
            --generate-notes
