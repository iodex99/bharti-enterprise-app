name: Android Release

# Every push to main that passes the gate publishes a release the installed app can see:
#   - web-bundle-v<version>.zip  the app installs this itself, one tap, no Play Store
#   - bharti-v<version>.apk      only needed for a first install or a native-shell change
#   - app-manifest.json          what the app reads to decide which of the two it needs
#
# Business data lives in the device's own storage and is never part of a bundle, so an
# update cannot touch it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Self-contained gate — a release is published only if everything passes HERE.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser + app-mode end-to-end suites
        run: npm run test:e2e

      # The 1.1.x line belongs to this workflow. The retired PC pipeline (release.yml,
      # now manual only) published 1.0.x from its own run numbering, so starting a new
      # minor here keeps versions unique AND always newer than anything already released.
      - name: Compute version
        run: |
          echo "VERSION=1.1.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build the app bundle
        env:
          APP_VERSION: ${{ env.VERSION }}
          # Installed devices poll the PUBLIC releases repo, so they need no credentials.
          UPDATE_FEED_URL: https://api.github.com/repos/${{ vars.RELEASES_REPO || 'iodex99/bharti-releases' }}/releases/latest
        run: npm run build:app

      # ---- native shell ----------------------------------------------------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - name: Sync the bundle into the Android project
        run: npx cap sync android

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — building a debug-signed APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
          ANDROID_VERSION_NAME: ${{ env.VERSION }}
          BHARTI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BHARTI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BHARTI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            echo "APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew assembleDebug --no-daemon
            echo "APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Package bundle + manifest + checksums
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
          APK_UNSIGNED: ${{ steps.keystore.outputs.signed == 'true' && '0' || '1' }}
        run: node scripts/package-app-bundle.mjs "$VERSION" "$APK_PATH"

      # Published to a small PUBLIC repository so devices can check for and download
      # updates with no credentials, while this source repository stays private.
      # Requires: that repo to exist (with a README, so it has a default branch) and a
      # fine-grained PAT with Contents: read+write on it, as secret RELEASES_REPO_TOKEN.
      # Until that is set up, releases land here instead and devices will not see them.
      - name: Publish the release
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_REPO: ${{ vars.RELEASES_REPO || 'iodex99/bharti-releases' }}
          # via env, never interpolated into the script: a commit message is arbitrary text
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASES_TOKEN" ]; then
            export GH_TOKEN="$RELEASES_TOKEN"
            TARGET="$RELEASES_REPO"
          else
            export GH_TOKEN="$FALLBACK_TOKEN"
            TARGET="$GITHUB_REPOSITORY"
            echo "::warning title=Update feed not configured::RELEASES_REPO_TOKEN is not set, so v$VERSION was published to the private repo $TARGET. Installed devices poll $RELEASES_REPO and will NOT see this release. See docs/DEPLOYMENT.md → Releasing."
          fi
          echo "Publishing v$VERSION to $TARGET"

          # Re-running a workflow reuses its run number; the rebuilt assets are
          # equivalent, so replace the release rather than failing the run.
          if gh release view "v$VERSION" --repo "$TARGET" >/dev/null 2>&1; then
            echo "v$VERSION already exists — replacing it."
            gh release delete "v$VERSION" --repo "$TARGET" --yes --cleanup-tag
          fi
          gh release create "v$VERSION" \
            dist-release/*.zip \
            dist-release/*.apk \
            dist-release/app-manifest.json \
            dist-release/checksums.txt \
            --repo "$TARGET" \
            --title "v$VERSION" \
            --notes "${NOTES:-Release v$VERSION}"
